services:
  api:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      - phoenix
    environment:
      PORT: "3000"
      NODE_ENV: production
      NO_COLOR: "1"
      SUPABASE_URL:
      SUPABASE_ANON_KEY:
      SUPABASE_SERVICE_ROLE_KEY:
      TELEGRAM_BOT_TOKEN:
      FRONTEND_URL:
      USE_BATCH_API:
      BATCH_SIZE:
      AI_CONCURRENCY: "5"
      OPENROUTER_BASE_URL: https://router.requesty.ai/v1
      YOUR_SITE_URL:
      YOUR_SITE_NAME: Telegram Lead Scanner
      AI_MODEL: policy/lead-analysis
      CATEGORY_API_KEY:
      CATEGORY_API_KEY_2:
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    restart: always

  worker:
    build:
      context: ./backend/python-service
      dockerfile: Dockerfile
    depends_on:
      - phoenix
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SUPABASE_URL:
      SUPABASE_ANON_KEY:
      SUPABASE_SERVICE_ROLE_KEY:
      TELEGRAM_BOT_TOKEN:
      OPENROUTER_BASE_URL: https://router.requesty.ai/v1
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    restart: always

  outreach-worker:
    build:
      context: ./backend/python-service
      dockerfile: Dockerfile
    command: ["python", "-u", "outreach_worker.py"]
    depends_on:
      - phoenix
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SUPABASE_URL:
      SUPABASE_ANON_KEY:
      SUPABASE_SERVICE_ROLE_KEY:
      TELEGRAM_BOT_TOKEN:
      OPENROUTER_BASE_URL: https://router.requesty.ai/v1
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    restart: always

  leadbot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    environment:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      LEADBOT_BOT_TOKEN:
      LEADBOT_ADMIN_IDS:
      LEADBOT_SUPABASE_HOST:
      LEADBOT_SUPABASE_PORT:
      LEADBOT_SUPABASE_DB:
      LEADBOT_SUPABASE_USER:
      LEADBOT_SUPABASE_PASSWORD:
      LEADBOT_SUPABASE_SSLMODE:
      LEADBOT_SUPABASE_SSL_INSECURE:
      LEADBOT_SUPABASE_POLL_SECONDS:
      LEADBOT_BACKFILL_LIMIT:
      LEADBOT_FREE_LEADS:
      LEADBOT_PRICE_RUB:
      LEADBOT_DURATION_DAYS:
      LEADBOT_YOOKASSA_SHOP_ID:
      LEADBOT_YOOKASSA_SECRET_KEY:
      LEADBOT_YOOKASSA_RETURN_URL:
      LEADBOT_YOOKASSA_RECEIPT_EMAIL:
      LEADBOT_YOOKASSA_RECEIPT_VAT_CODE:
      LEADBOT_YOOKASSA_RECEIPT_TAX_SYSTEM_CODE:
      LEADBOT_LOG_LEVEL:
    restart: always

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_HOST_ROOT_PATH: /phoenix
    restart: always
