name: Deploy to 139

# Пуш в production → выкладка на сервер 139.60.162.24 (/opt/tg-scanner, перенос с Timeweb 12.11.2026).
# Ключ DEPLOY_139_SSH_KEY на сервере ограничен одной командой: deploy.sh newai —
# скачать ветку production, пересобрать и перезапустить контейнеры. Ничего другого им сделать нельзя.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-139
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_139_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Отпечаток ключа сервера закреплён: SHA256:dl0Kdm8qTiwQlu1DpBC3w77WIxjSPG0BhQJs2D/RW0o
          echo '139.60.162.24 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGJUxmzADhlR7c6L5exC+ED/RoGOHBsr2/88qiJwMg5M' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 root@139.60.162.24
